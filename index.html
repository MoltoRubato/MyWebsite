<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Primary meta -->
<title>Ryan's Place</title>
<meta name="description" content="An interactive pixel-art apartment that doubles as Kerui (Ryan) Huang's portfolio — wander the rooms and play chess, pool, and music as you explore his work.">
<meta name="author" content="Kerui (Ryan) Huang">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#10131c">
<link rel="canonical" href="https://ryanhuang.work/">

<!-- Icons -->
<link rel="icon" type="image/png" href="assets/ui/favicon.png">
<link rel="apple-touch-icon" href="assets/ui/favicon.png">

<!-- Open Graph (Facebook, LinkedIn, iMessage, Discord, …) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ryan's Place">
<meta property="og:title" content="Ryan's Place">
<meta property="og:description" content="An interactive pixel-art world that doubles as my portfolio. Wander the rooms, meet the characters, and play chess, pool, and music while you explore my work.">
<meta property="og:url" content="https://ryanhuang.work/">
<meta property="og:image" content="https://ryanhuang.work/assets/og/og.png">
<meta property="og:image:secure_url" content="https://ryanhuang.work/assets/og/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A pixel-art lounge with three characters lined up beneath the title 'Ryan's Place'.">
<meta property="og:locale" content="en_AU">

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ryan's Place">
<meta name="twitter:description" content="An interactive pixel-art world that doubles as my portfolio — wander the rooms and play chess, pool, and music while you explore my work.">
<meta name="twitter:image" content="https://ryanhuang.work/assets/og/og.png">
<meta name="twitter:image:alt" content="A pixel-art lounge with three characters lined up beneath the title 'Ryan's Place'.">

<!-- Structured data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Kerui (Ryan) Huang",
  "alternateName": "Ryan Huang",
  "url": "https://ryanhuang.work/",
  "image": "https://ryanhuang.work/assets/photo/ryan.jpg",
  "jobTitle": "Forward Deployed Engineer",
  "worksFor": { "@type": "Organization", "name": "Lyra" },
  "address": { "@type": "PostalAddress", "addressLocality": "Melbourne", "addressCountry": "AU" },
  "sameAs": [
    "https://www.linkedin.com/in/kerui-huang/",
    "https://github.com/MoltoRubato",
    "https://www.instagram.com/itsryianx/"
  ]
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <!-- Website header -->
  <header id="siteHeader" class="hidden">
    <div class="hd-left">
      <button class="hd-logo" data-nav="home">
        <span class="hd-logo-mark">RH</span>
        <span class="hd-logo-text">Ryan&nbsp;Huang</span>
      </button>
    </div>
    <nav class="hd-nav" id="hdNav" aria-label="Main">
      <button class="hd-link" data-nav="about"><span>About</span></button>
      <button class="hd-link" data-nav="experience"><span>Experience</span></button>
      <button class="hd-link" data-nav="projects"><span>Projects</span></button>
      <button class="hd-link" data-nav="trophies"><span>Trophies</span></button>
      <button class="hd-link" data-nav="contact"><span>Contact</span></button>
    </nav>
    <div class="hd-right">
      <button class="hd-icon" data-nav="map" title="Room map" aria-label="Room map"><span class="ico ico-map"></span></button>
      <button class="hd-icon" data-nav="sound" title="Sound" aria-label="Toggle sound"><span class="ico ico-sound"></span></button>
      <button class="hd-icon hd-burger" data-nav="menu" aria-label="Menu" aria-expanded="false" aria-controls="hdNav"><span class="ico ico-burger"></span></button>
    </div>
  </header>

  <!-- Game stage -->
  <div id="stage">
    <canvas id="game" width="960" height="640"></canvas>
    <!-- room nameplate -->
    <div id="roomLabel"><span class="rl-inner"></span></div>
    <!-- interaction hint -->
    <div id="hint" class="hidden"><span class="hint-key">Enter</span><span class="hint-text"></span></div>
    <!-- transition veil -->
    <div id="veil"></div>
    <!-- on-screen controls (touch) -->
    <div id="touch" aria-hidden="true">
      <div id="joyZone">
        <span id="joyHome"></span>
        <div id="joystick"><span id="joyKnob"></span></div>
      </div>
      <button id="actBtn" data-key="enter">●</button>
    </div>
  </div>

  <!-- Dialogue (modern UI) -->
  <div id="dialogue" class="hidden">
    <div class="dlg-choices" id="dlgChoices"></div>
    <div class="dlg-main">
      <div class="dlg-portrait"><canvas id="dlgPortrait" width="64" height="64"></canvas></div>
      <div class="dlg-name" id="dlgName">Name</div>
      <div class="dlg-body"><p id="dlgText"></p></div>
      <button class="dlg-close" id="dlgClose">✕</button>
      <div class="dlg-next" id="dlgNext">▼</div>
    </div>
  </div>

  <!-- Centered content modal (header) -->
  <div id="panelScrim" class="hidden"></div>
  <div id="panel" class="hidden" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="panel-card">
      <button id="panelClose" class="panel-close" aria-label="Close">✕</button>
      <div id="panelInner"></div>
    </div>
  </div>

  <!-- Room map / fast travel -->
  <div id="mapModal" class="hidden">
    <div class="map-card">
      <div class="map-head">
        <h3 class="map-title">Floor Plan</h3>
        <p class="map-sub">Tap a room to travel there</p>
      </div>
      <div class="map-plan" id="mapGrid"></div>
      <button class="map-close" id="mapClose">Close</button>
    </div>
  </div>

  <!-- Activity overlay host (chess / pool / music / workout) -->
  <div id="activity" class="hidden"><div id="activityInner"></div></div>

  <!-- Loading / title screen -->
  <div id="loader">
    <canvas id="loadCanvas" width="960" height="640"></canvas>
    <div class="load-overlay">
      <div class="load-card">
        <h1 class="load-title">RYAN&#39;S&nbsp;PLACE</h1>
        <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
        <div class="load-status" id="loadStatus">LOADING…</div>
        <button class="load-enter hidden" id="loadEnter">ENTER&nbsp;WORLD</button>
        <div class="load-controls">WASD / Arrows to move · ENTER to interact</div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
